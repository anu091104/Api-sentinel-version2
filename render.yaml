# Render "Blueprint" — lets you deploy the backend + a managed Postgres database
# in one step via Render's "New > Blueprint" flow pointed at this repo.
# See README.md > Deployment for the manual dashboard steps as an alternative.

services:
  - type: web
    name: api-sentinel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-sentinel-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # set manually to your Vercel URL after the frontend is deployed
      - key: SWEEP_INTERVAL_SECONDS
        value: "60"

databases:
  - name: api-sentinel-db
    plan: free
